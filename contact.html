<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>contact — i·c morel</title>
<link rel="canonical" href="https://icmorel.com/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Mono:wght@0,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0e0d0b;
  --paper:#f5f0e8;
  --dim:#7a7268;
  --accent:#8b3a2a;
  --faint:#2a2620;
}
body{background:var(--ink);font-family:'Cormorant Garamond',serif;min-height:100vh;display:flex;justify-content:center;padding:3rem 1.5rem}

.page{width:100%;max-width:420px;display:flex;flex-direction:column;gap:0}

.name{font-weight:300;font-style:italic;font-size:clamp(3.2rem,12vw,4.8rem);line-height:0.88;letter-spacing:-0.02em;color:var(--paper);margin-bottom:0.8rem}
.surname{font-style:normal;color:var(--accent);display:block}

.descriptor{font-family:'DM Mono',monospace;font-size:0.7rem;font-weight:300;letter-spacing:0.18em;color:var(--dim);text-transform:lowercase;margin-bottom:1.2rem}

.nav-row{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;padding-bottom:1.6rem;border-bottom:0.5px solid var(--faint)}
.ndiv{width:0.5px;height:12px;background:var(--faint);flex-shrink:0}

.nav-icon{display:flex;align-items:center;justify-content:center;position:relative;text-decoration:none}
.nav-icon img{width:20px;height:20px;display:block;opacity:0.45;transition:opacity 0.2s}
.nav-icon:hover img{opacity:1}
.nav-icon-label{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity 0.2s;pointer-events:none}
.nav-icon:hover .nav-icon-label{opacity:1}
.icon-group{display:flex;align-items:center;gap:1.2rem}

.contact-block{margin-top:2.5rem}
.item-label{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.2em;text-transform:lowercase;color:var(--accent);margin-bottom:0.9rem}

.note{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:1.05rem;color:#b8ada0;line-height:1.7;margin-bottom:1rem}
.email-line{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;color:var(--dim);margin-bottom:2rem}
.email-line a{color:var(--dim);text-decoration:none}
.email-line a:hover{color:var(--paper)}

form{display:flex;flex-direction:column;gap:0}

.field{display:flex;flex-direction:column;border-top:0.5px solid var(--faint);padding:0.9rem 0}
.field:last-of-type{border-bottom:0.5px solid var(--faint)}

label{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.18em;text-transform:lowercase;color:var(--accent);margin-bottom:0.5rem}

input, textarea{background:transparent;border:none;outline:none;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.05rem;color:var(--paper);width:100%;resize:none}
input::placeholder, textarea::placeholder{color:var(--faint)}
textarea{min-height:100px;line-height:1.6}

.submit-row{margin-top:1.8rem;display:flex;justify-content:flex-end}
button[type="submit"]{background:transparent;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:0.65rem;font-weight:300;letter-spacing:0.2em;text-transform:lowercase;color:var(--dim);padding:0;border-bottom:0.5px solid var(--faint);padding-bottom:2px;transition:color 0.2s,border-color 0.2s}
button[type="submit"]:hover{color:var(--paper);border-color:#5a5040}

.success{display:none;margin-top:2rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:#b8ada0}

.subscribe{margin-top:2.5rem;padding-top:1.5rem;border-top:0.5px solid var(--faint)}

/* EmailOctopus form overrides */
#eo-form-wrapper, .eo-form-wrapper,
[id^="eo-"] form, .eo-form{
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  padding:0 !important;
  margin:0 !important;
  font-family:'DM Mono',monospace !important;
}
[id^="eo-"] input[type="email"],
.eo-form input[type="email"]{
  background:transparent !important;
  border:none !important;
  border-top:0.5px solid var(--faint) !important;
  border-radius:0 !important;
  color:var(--paper) !important;
  font-family:'Cormorant Garamond',serif !important;
  font-size:1.05rem !important;
  font-weight:300 !important;
  padding:0.9rem 0 !important;
  width:100% !important;
  outline:none !important;
  box-shadow:none !important;
}
[id^="eo-"] input[type="email"]::placeholder,
.eo-form input[type="email"]::placeholder{
  color:var(--faint) !important;
}
[id^="eo-"] input[type="submit"],
[id^="eo-"] button[type="submit"],
.eo-form input[type="submit"],
.eo-form button[type="submit"]{
  background:transparent !important;
  border:none !important;
  border-bottom:0.5px solid var(--faint) !important;
  border-radius:0 !important;
  color:var(--dim) !important;
  font-family:'DM Mono',monospace !important;
  font-size:0.65rem !important;
  font-weight:300 !important;
  letter-spacing:0.2em !important;
  text-transform:lowercase !important;
  padding:0 0 2px 0 !important;
  cursor:pointer !important;
  margin-top:1rem !important;
  float:right !important;
  box-shadow:none !important;
  width:auto !important;
}
[id^="eo-"] input[type="submit"]:hover,
[id^="eo-"] button[type="submit"]:hover,
.eo-form input[type="submit"]:hover,
.eo-form button[type="submit"]:hover{
  color:var(--paper) !important;
  border-color:#5a5040 !important;
  background:transparent !important;
}
[id^="eo-"] label,
.eo-form label{
  font-family:'DM Mono',monospace !important;
  font-size:0.6rem !important;
  letter-spacing:0.18em !important;
  text-transform:lowercase !important;
  color:var(--accent) !important;
}
[id^="eo-"] .eo-form-footer,
.eo-form-footer{
  text-align:center !important;
  margin-top:0.8rem !important;
}
[id^="eo-"] .eo-form-footer a,
.eo-form-footer a{
  font-family:'DM Mono',monospace !important;
  font-size:0.42rem !important;
  color:var(--faint) !important;
  letter-spacing:0.1em !important;
}

footer{margin-top:3rem;padding-top:1.2rem;border-top:0.5px solid var(--faint);display:flex;justify-content:flex-end}
.footer-copy{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;color:#2e2b26;text-transform:lowercase}
</style>
</head>
<body>
<div class="page">

  <div class="name">
    <span>i·c</span>
    <span class="surname">morel</span>
  </div>

  <p class="descriptor">fiction &amp; poetry writer</p>

  <div class="nav-row">
    <div class="icon-group">
      <a href="/" class="nav-icon">
        <img src="icons/icon-home.svg" alt="home">
        <span class="nav-icon-label">home</span>
      </a>
      <a href="about.html" class="nav-icon">
        <img src="icons/icon-about.svg" alt="about">
        <span class="nav-icon-label">about</span>
      </a>
      <a href="books.html" class="nav-icon">
        <img src="icons/icon-books.svg" alt="books">
        <span class="nav-icon-label">books</span>
      </a>
      <a href="contact.html" class="nav-icon">
        <img src="icons/icon-contact.svg" alt="contact">
        <span class="nav-icon-label">contact</span>
      </a>
    </div>
    <div class="ndiv"></div>
    <div class="icon-group">
      <a href="https://www.instagram.com/i.c.morel/" class="nav-icon" target="_blank" rel="noopener">
        <img src="icons/icon-instagram.svg" alt="instagram">
        <span class="nav-icon-label">instagram</span>
      </a>
      <a href="https://www.goodreads.com/user/show/188700803-i-c-morel" class="nav-icon" target="_blank" rel="noopener">
        <img src="icons/icon-goodreads.svg" alt="goodreads">
        <span class="nav-icon-label">goodreads</span>
      </a>
      <a href="https://substack.com/@icmorel" class="nav-icon" target="_blank" rel="noopener">
        <img src="icons/icon-substack.svg" alt="substack">
        <span class="nav-icon-label">substack</span>
      </a>
    </div>
  </div>

  <div class="contact-block">
    <p class="item-label">contact</p>
    <p class="note">for inquiries, submissions, or correspondence.</p>
    <p class="email-line"><a href="mailto:hello@icmorel.com">hello@icmorel.com</a></p>

    <form action="https://formspree.io/f/mvzdwpld" method="POST">
      <div class="field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" placeholder="your name" required>
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" placeholder="your message" required></textarea>
      </div>
      <div class="submit-row">
        <button type="submit">send →</button>
      </div>
    </form>

    <p class="success" id="success">thank you — i'll be in touch.</p>
  </div>

  <div class="subscribe">
    <p class="item-label">stay in the loop</p>
    <script async src="https://eocampaign1.com/form/ff7b33e0-7a9e-11f1-b633-3f92cecdc4b3.js" data-form="ff7b33e0-7a9e-11f1-b633-3f92cecdc4b3"></script>
  </div>

  <footer>
    <p class="footer-copy">© i·c morel</p>
  </footer>

</div>
<script>
const form = document.querySelector('form');
const success = document.getElementById('success');
form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const data = new FormData(form);
  const res = await fetch(form.action, {method:'POST', body:data, headers:{Accept:'application/json'}});
  if(res.ok){
    form.style.display = 'none';
    success.style.display = 'block';
  }
});
</script>
</body>
</html>
